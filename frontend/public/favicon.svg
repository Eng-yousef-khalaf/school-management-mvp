<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded Background Shield -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Inner Soft Glow Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Open Book Base -->
  <g filter="url(#shadow)">
    <!-- Left Page -->
    <path d="M12 44 C 18 42, 26 43, 32 46 L 32 26 C 26 23, 18 22, 12 24 Z" fill="#ffffff" opacity="0.95" />
    <!-- Right Page -->
    <path d="M52 44 C 46 42, 38 43, 32 46 L 32 26 C 38 23, 46 22, 52 24 Z" fill="#f8fafc" opacity="0.95" />
    <!-- Book Spine Line -->
    <line x1="32" y1="26" x2="32" y2="46" stroke="#4338ca" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Page Lines for detail -->
    <line x1="16" y1="29" x2="28" y2="31" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="16" y1="34" x2="28" y2="36" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="16" y1="39" x2="26" y2="41" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    
    <line x1="36" y1="31" x2="48" y2="29" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="36" y1="36" x2="48" y2="34" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
    <line x1="38" y1="41" x2="48" y2="39" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Graduation Cap Floating Above -->
  <g filter="url(#shadow)">
    <!-- Cap Diamond Top -->
    <polygon points="32,10 50,17 32,24 14,17" fill="url(#goldGrad)" />
    <!-- Cap Lower Band -->
    <path d="M22 20.5 L 22 25.5 C 22 28.5, 42 28.5, 42 25.5 L 42 20.5 Z" fill="#d97706" />
    <!-- Cap Tassel Point & String -->
    <path d="M32 17 Q 44 19 46 27" fill="none" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="46" cy="27.5" r="1.8" fill="#fef08a" />
  </g>

  <!-- Small Academic Golden Star at bottom center -->
  <polygon points="32,49 33.5,53.5 38,53.5 34.5,56 36,60.5 32,58 28,60.5 29.5,56 26,53.5 30.5,53.5" fill="url(#goldGrad)" />
</svg>
