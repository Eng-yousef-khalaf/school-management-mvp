<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="100%" height="100%">
  <!-- UNICEF Official Wordmark with pristine letter spacing -->
  <text
    x="28"
    y="114"
    fill="#00AEEF"
    font-family="'Univers 65 Bold', 'Univers', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="90"
    font-weight="bold"
    letter-spacing="1.5px"
  >
    unicef
  </text>

  <!-- UNICEF Official Circular Emblem (Globe + Mother & Child + Laurel Wreath) -->
  <g transform="translate(425, 80) scale(0.68)">
    <!-- Outer Laurel Wreath / Olive Branches Left & Right -->
    <!-- Left Branch -->
    <path d="M -15 88 C -55 80 -95 40 -95 -15 C -95 -45 -80 -75 -55 -95 C -58 -85 -55 -70 -42 -60 C -52 -50 -55 -35 -48 -22 C -58 -10 -60 8 -50 22 C -58 35 -55 52 -42 64 C -50 74 -35 84 -15 88 Z" fill="#00AEEF" />
    <path d="M -75 -40 C -82 -32 -85 -18 -80 -8 C -86 2 -88 18 -80 28 C -86 38 -82 52 -70 62 C -80 48 -80 30 -75 15 C -80 0 -78 -20 -75 -40 Z" fill="#00AEEF" />
    <!-- Right Branch -->
    <path d="M 15 88 C 55 80 95 40 95 -15 C 95 -45 80 -75 55 -95 C 58 -85 55 -70 42 -60 C 52 -50 55 -35 48 -22 C 58 -10 60 8 50 22 C 58 35 55 52 42 64 C 50 74 35 84 15 88 Z" fill="#00AEEF" />
    <path d="M 75 -40 C 82 -32 85 -18 80 -8 C 86 2 88 18 80 28 C 86 38 82 52 70 62 C 80 48 80 30 75 15 C 80 0 78 -20 75 -40 Z" fill="#00AEEF" />

    <!-- Bottom Ribbon Tie -->
    <path d="M -18 90 C -6 98 6 98 18 90 C 24 105 10 115 0 102 C -10 115 -24 105 -18 90 Z" fill="#00AEEF" />

    <!-- Inner Globe Circle & Grid Lines -->
    <circle cx="0" cy="-6" r="68" fill="none" stroke="#00AEEF" stroke-width="3" />
    <!-- Latitude rings -->
    <ellipse cx="0" cy="-6" rx="68" ry="46" fill="none" stroke="#00AEEF" stroke-width="2.2" stroke-dasharray="1 0" />
    <ellipse cx="0" cy="-6" rx="68" ry="24" fill="none" stroke="#00AEEF" stroke-width="2.2" stroke-dasharray="1 0" />
    <!-- Longitude lines radiating polar grid -->
    <line x1="-68" y1="-6" x2="68" y2="-6" stroke="#00AEEF" stroke-width="2.2" />
    <line x1="0" y1="-74" x2="0" y2="62" stroke="#00AEEF" stroke-width="2.2" />
    <line x1="-48" y1="-54" x2="48" y2="42" stroke="#00AEEF" stroke-width="2.2" />
    <line x1="48" y1="-54" x2="-48" y2="42" stroke="#00AEEF" stroke-width="2.2" />

    <!-- Solid Silhouette: Mother & Child Silhouette (Emblem Heart) -->
    <!-- Mother Silhouette -->
    <path d="M 4 -12 C 14 -32 38 -36 48 -18 C 55 -4 55 18 42 32 C 32 42 12 48 -4 44 C -18 40 -26 28 -20 22 C -14 16 -8 24 4 24 C 18 24 30 16 32 2 C 34 -10 24 -20 12 -18 C 6 -17 2 -15 4 -12 Z" fill="#00AEEF" />
    <!-- Mother Head -->
    <circle cx="36" cy="-14" r="17" fill="#00AEEF" />

    <!-- Child Silhouette in Mother's embrace -->
    <!-- Child Head -->
    <circle cx="-16" cy="-10" r="14" fill="#00AEEF" />
    <!-- Child Body / Arms raised -->
    <path d="M -30 2 C -30 -2 -24 -4 -16 -4 C -8 -4 0 -2 0 6 C 0 16 -12 28 -24 28 C -30 28 -32 22 -30 14 C -28 6 -30 4 -30 2 Z" fill="#00AEEF" />
    <!-- Reaching arms -->
    <path d="M -4 2 C 6 2 14 -4 16 -10 C 14 -12 8 -8 0 -6 Z" fill="#00AEEF" />
  </g>
</svg>
