<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C15" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />
  
  <!-- Subtle Grid Overlay -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Circles -->
  <circle cx="120" cy="60" r="100" fill="#0284C7" opacity="0.12" filter="url(#glow)" />
  <circle cx="780" cy="180" r="90" fill="#6366F1" opacity="0.12" filter="url(#glow)" />

  <!-- Status / Pill Tag -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="220" height="24" rx="12" fill="#0369A1" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#38BDF8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" fill="#38BDF8" letter-spacing="1">DATA SCIENCE &amp; AI ENGINEER</text>
  </g>

  <!-- Main Name Title -->
  <text x="60" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" fill="#F8FAFC" letter-spacing="0.5">
    ENG. YOUSEF KHALAF
  </text>

  <!-- Subtitle / Tagline -->
  <text x="60" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#94A3B8" letter-spacing="0.3">
    Machine Learning Specialist  •  Predictive Modeling  •  Full-Stack Data Architect
  </text>

  <!-- Feature Badge Pills (Bottom) -->
  <g transform="translate(60, 180)">
    <!-- Pill 1: Python & ML -->
    <rect x="0" y="0" width="130" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="65" y="17.5" font-family="monospace" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">🐍 Python &amp; ML</text>

    <!-- Pill 2: Deep Learning -->
    <rect x="142" y="0" width="135" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="209" y="17.5" font-family="monospace" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">🧠 Deep Learning</text>

    <!-- Pill 3: SQL & Analytics -->
    <rect x="289" y="0" width="145" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="361" y="17.5" font-family="monospace" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">📊 SQL &amp; Analytics</text>

    <!-- Pill 4: Full-Stack Systems -->
    <rect x="446" y="0" width="155" height="26" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="523" y="17.5" font-family="monospace" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">⚡ Full-Stack Systems</text>
  </g>

  <!-- Right Decorative Icon / Graph Graphic -->
  <g transform="translate(740, 60)" opacity="0.85">
    <circle cx="50" cy="50" r="45" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle cx="50" cy="50" r="32" fill="#0F172A" stroke="#0284C7" stroke-width="2" />
    <path d="M 32 60 L 44 46 L 54 54 L 68 36" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="60" r="3" fill="#38BDF8"/>
    <circle cx="44" cy="46" r="3" fill="#38BDF8"/>
    <circle cx="54" cy="54" r="3" fill="#38BDF8"/>
    <circle cx="68" cy="36" r="3" fill="#38BDF8"/>
  </g>
</svg>
